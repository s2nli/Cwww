/* Lecture Player - styles. Needs a parent element; player root gets class .lp */
.lp,.lp *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--lp-accent:#e9c987;--lp-glass:rgba(14,15,20,.76);--lp-line:rgba(255,255,255,.1);--lp-text:#f3f4f8;--lp-dim:#a6abbb}
.lp{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;font-size:14px;color:var(--lp-text);outline:0}

.lp.idle{cursor:none}
.lp button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:background .15s,opacity .15s}

.lp-top,.lp-bot,.lp-side{position:absolute;z-index:3;transition:opacity .25s}
.lp.idle .lp-top,.lp.idle .lp-bot,.lp.idle .lp-side,.lp.locked .lp-top,.lp.locked .lp-bot{opacity:0;pointer-events:none}
.lp-top{left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 10px 28px;background:linear-gradient(#000c,#0000)}
.lp-title{flex:1;margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-side{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.lp-side button{background:var(--lp-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--lp-line)}
.lp.locked [data-a=side]{display:none}
.lp-bot{pointer-events:none;left:0;right:0;bottom:0;padding:34px 12px max(8px,env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d)}
.lp-prog{font-size:13px;font-variant-numeric:tabular-nums;color:#e8e9f0}.lp-times{display:flex;justify-content:space-between;padding:0 2px;font-weight:600;letter-spacing:.5px}.lp-seg{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#000;z-index:1}
.lp-bar{position:relative;height:24px;touch-action:none;cursor:pointer}
.lp-track{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff3;border-radius:3px;transition:height .15s,margin .15s}
.lp-bar:hover .lp-track,.lp.drag .lp-track{height:5px;margin-top:-2.5px}
.lp-buf,.lp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:0}
.lp-buf{background:#fff5}.lp-fill{background:var(--lp-accent)}
.lp-thumb{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 #ffffff44;transition:transform .15s,box-shadow .15s}
.lp.drag .lp-thumb{transform:scale(1.7);box-shadow:0 0 0 7px #ffffff33}
.lp-tip{position:absolute;bottom:28px;left:0;transform:translateX(-50%);padding:4px 9px;border-radius:8px;background:var(--lp-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--lp-line);font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
.lp.drag .lp-tip,.lp-bar:hover .lp-tip{opacity:1}
.lp-ctl{display:flex;align-items:center;gap:2px;margin-top:2px}
.lp-sp{flex:1}
.lp-vol{width:0;opacity:0;accent-color:var(--lp-accent);transition:width .2s,opacity .2s;height:4px}
.lp-vwrap:hover .lp-vol,.lp-vol:focus{width:76px;opacity:1}
.lp .chip{width:auto;height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:600;background:#ffffff14}
.lp .chip:hover{background:#ffffff26}
.lp-spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;border:3px solid #fff2;border-top-color:var(--lp-accent);animation:sp .8s linear infinite;z-index:2;display:none;pointer-events:none}
.lp.busy .lp-spin{display:block}@keyframes sp{to{transform:rotate(1turn)}}
.lp-fx{position:absolute;top:0;bottom:0;width:34%;z-index:2;display:grid;place-items:center;font-weight:700;font-size:15px;opacity:0;pointer-events:none;background:radial-gradient(circle,#ffffff26,#0000 70%)}
.lp-fx.l{left:0}.lp-fx.r{right:0}.lp-fx.go{animation:fx .55s ease-out}@keyframes fx{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.lp-err{position:absolute;inset:0;z-index:4;display:none;place-content:center;justify-items:center;gap:12px;text-align:center;background:#000b;padding:20px}
.lp.failed .lp-err{display:grid}.lp-err p{margin:0;color:var(--lp-dim)}
.lp-err button{width:auto;border-radius:20px;padding:0 20px;background:var(--lp-accent);color:#111;font-weight:700}
.lp-menu,.lp-panel,.lp-toast{background:var(--lp-glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--lp-line);box-shadow:0 18px 50px #0008;border-radius:18px}
.lp-menu{position:absolute;z-index:5;right:12px;bottom:78px;width:min(300px,calc(100% - 24px));max-height:calc(100% - 100px);overflow:auto;padding:14px;opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom right;pointer-events:none;transition:opacity .18s,transform .18s}

.lp-row{display:flex!important;align-items:center;gap:12px;width:100%!important;height:44px!important;padding:0 12px!important;border-radius:12px!important;font-size:14px;text-align:left;justify-content:flex-start!important}
.lp-panel{position:absolute;z-index:6;top:10px;right:10px;bottom:10px;width:min(340px,88%);padding:14px 10px;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .2s,transform .2s}
.lp-panel.open{opacity:1;transform:none;pointer-events:auto}
.lp-ph{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;font-weight:700}
.lp-pb{overflow:auto;flex:1}
.lp-item{display:flex!important;gap:10px;align-items:center;width:100%!important;height:auto!important;min-height:46px;padding:9px 10px!important;border-radius:12px!important;text-align:left;justify-content:flex-start!important;font-size:14px;text-decoration:none;color:inherit}
.lp-item small{display:block;color:var(--lp-dim);margin-top:2px}.lp-item.on{background:#ffffff22}
.lp-item b{font-variant-numeric:tabular-nums;font-size:12px;color:var(--lp-accent);min-width:42px}
.lp-empty{padding:24px 12px;color:var(--lp-dim);text-align:center}
.lp-toast{position:absolute;z-index:7;left:50%;bottom:84px;transform:translate(-50%,10px);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.2s;max-width:92%;white-space:nowrap;font-size:13px;border-radius:24px}
.lp-toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.lp-toast button{width:auto!important;height:30px!important;padding:0 14px;border-radius:15px!important;background:var(--lp-accent)!important;color:#111;font-weight:700;font-size:13px}
.lp-toast button.ghost{background:#ffffff1c!important;color:#fff}
.lp{touch-action:none}

.lp-hud{position:absolute;z-index:9;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-6px);padding:8px 16px;border-radius:22px;background:rgba(14,15,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--lp-line);font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.lp-hud svg{width:18px;height:18px;flex:none;color:var(--lp-accent,#e9c987)}.lp-hud b{font-weight:700}.lp-hud .bar{display:block;width:90px;height:4px;border-radius:2px;background:#ffffff30;overflow:hidden}.lp-hud .bar u{display:block;height:100%;background:var(--lp-accent,#e9c987);border-radius:2px;text-decoration:none}

.lp-aud{position:absolute;inset:0;z-index:2;display:none;place-content:center;justify-items:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(circle at 50% 40%,#2a2740,#050507 70%)}
.lp.audio .lp-aud{display:grid}.lp.audio video{opacity:0}.lp-aud p{margin:0;font-size:18px;font-weight:700}.lp-aud small{color:var(--lp-dim)}
.lp-row em{margin-left:auto;font-style:normal;color:var(--lp-dim)}.lp-row.back{margin-bottom:6px}

:root{--bg:#0a0c14;--panel:#12151f;--line:rgba(255,255,255,.1);--text:#f3f4f8;--dim:#a6abbb;--brand:#8b7cff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.bar img{width:28px;height:28px;border-radius:8px}
#start{max-width:560px;margin:0 auto;padding:22px 16px}
#start h1{font-size:22px;margin:6px 0 6px}#start p{color:var(--dim);margin:0 0 16px;line-height:1.5;font-size:14px}
#start label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
#start input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:15px}
#start button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(140deg,#a69cff,var(--brand));color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#msg{margin-top:12px;color:#ff8a8a;font-size:14px;min-height:20px}
#stage{position:fixed;inset:0;z-index:50;background:#000;overflow-y:auto}
#playerRoot{position:sticky;top:0;z-index:2;background:#000;padding-top:env(safe-area-inset-top)}
#playerRoot.lp{border-radius:0}
.pinfo{padding:16px;background:var(--bg);min-height:calc(100vh - 56.25vw)}
.pinfo h2{margin:0 0 4px;font-size:18px}.pinfo p{margin:0 0 14px;color:var(--dim);font-size:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;cursor:pointer}
.row.now{border-color:var(--brand);background:rgba(139,124,255,.12)}

};

</script>
<script>

(function(){
"use strict";
/* ===== EDIT HERE: put your lectures (optional). Each: {title:"...", url:"https://....m3u8 | .mp4 | YouTube link"} ===== */
var LECTURES = [
  // {title:"Class 01", url:"https://example.com/class01.m3u8"},
];
/* ========================================================================================================= */
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var list=[],player=null,cur=-1;
function okUrl(u){try{var x=new URL(String(u).trim());return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}}
function showStart(msg){destroy();$("#stage").hidden=true;document.body.style.overflow="";$("#start").hidden=false;$("#msg").textContent=msg||""}
function destroy(){try{player&&player.destroy()}catch(e){}player=null;$("#playerRoot").innerHTML=""}
function data(n){var e=list[n],mk=function(i){return {id:"sa:"+list[i].url,title:list[i].title,i:i}};
 return {id:"sa:"+e.url,title:e.title,videoUrl:e.url,quality:{},chapters:[],attachments:[],downloadUrl:/\.(mp4|webm)(\?|#|$)/i.test(e.url)?e.url:null,autoplay:true,course:"CODEX STUDYS",
  lectures:list.map(function(_,i){return mk(i)}),previousLecture:n>0?mk(n-1):null,nextLecture:n<list.length-1?mk(n+1):null}}
function info(n){$("#pTitle").textContent=list[n].title;$("#pSub").textContent=list.length>1?(n+1)+" / "+list.length:"";
 var l=$("#pList");l.innerHTML=list.length>1?list.map(function(e,i){return '<button class="row'+(i===n?" now":"")+'" data-p="'+i+'"><span class="n">'+(i+1)+'</span><b>'+esc(e.title)+'</b></button>'}).join(""):"";
 [].forEach.call(l.querySelectorAll("[data-p]"),function(b){b.onclick=function(){play(+b.dataset.p)}})}
function play(n){var e=list[n];if(!e)return;cur=n;$("#start").hidden=true;$("#stage").hidden=false;document.body.style.overflow="hidden";info(n);
 var d=data(n),nav=function(x){if(x)play(x.i)};
 if(player){player.load(d);return}
 if(typeof window.LecturePlayer!=="function"){$("#playerRoot").innerHTML='<div style="padding:24px;color:#fff">Player failed to load. Reload the page.</div>';return}
 player=new window.LecturePlayer($("#playerRoot"),d,{onBack:function(){showStart()},onNavigate:nav,onSelectLecture:nav});
 try{window.LecturePlayer.mediaSession(player,"")}catch(e2){}}
function boot(){
 var q=new URLSearchParams(location.search),src=q.get("src")||q.get("url");
 if(src){var u=okUrl(src)||(/^[\w-]{11}$/.test(src)?"https://www.youtube.com/watch?v="+src:null);
  if(u){list=[{title:q.get("title")||"Lecture",url:u}];return play(0)}
  return showStart("That link is not valid. Use a full https:// link to an .m3u8, .mp4 or YouTube video.")}
 list=LECTURES.map(function(x){return {title:String(x.title||"Lecture"),url:okUrl(x.url)}}).filter(function(x){return x.url});
 if(list.length)return play(0);
 showStart();
}
$("#go").onclick=function(){var u=okUrl($("#u").value);if(!u&&/^[\w-]{11}$/.test($("#u").value.trim()))u="https://www.youtube.com/watch?v="+$("#u").value.trim();
 if(!u)return($("#msg").textContent="Enter a valid https:// link (.m3u8, .mp4 or YouTube).");
 list=[{title:$("#t").value.trim()||"Lecture",url:u}];play(0)};
$("#u").addEventListener("keydown",function(e){if(e.key==="Enter")$("#go").click()});
boot();
})();

</script>
</body></html>
